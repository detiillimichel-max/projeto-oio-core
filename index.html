<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0; url=oio-id.html">
    <title>OIO ONE</title>
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <script>
        // Entrada normal do aplicativo: OIO ID.
        // Quando o usuário já está no OIO ID e escolhe "OIO Core",
        // a entrada pelo índice deve abrir o Core em teste.html.
        const fromOioId = document.referrer && /\/oio-id\.html(?:[?#]|$)/.test(document.referrer);
        window.location.replace(fromOioId ? 'teste.html' : 'oio-id.html');
    </script>
    <noscript>
        <a href="oio-id.html">Abrir OIO ID</a>
    </noscript>
</body>
</html>
