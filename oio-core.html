<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#E8E5DF">
<title>OIO ONE — Core</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#E8E5DF}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#E8E5DF}
#identity-photo{position:fixed;z-index:100;top:27px;left:32px;width:56px;height:56px;border-radius:50%;object-fit:cover;border:2px solid #968F83;background:#A5A58D;display:none;pointer-events:none}
#identity-dot{position:fixed;z-index:101;top:73px;left:78px;width:12px;height:12px;border-radius:50%;background:#3c8a42;border:2px solid #E8E5DF;display:none;pointer-events:none}
#loading{position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:#E8E5DF;color:#625c54;font:14px sans-serif}
</style>
</head>
<body>
<div id="loading">Abrindo OIO Core…</div>
<img id="identity-photo" alt="Foto do usuário OIO">
<span id="identity-dot" aria-hidden="true"></span>
<script>
(async()=>{
  try{
    const r=await fetch('/api/auth/session',{credentials:'same-origin',cache:'no-store'});
    const data=await r.json().catch(()=>({}));
    if(!r.ok||!data.authenticated){window.location.replace('oio-id-entry.html');return;}

    const account=data.account||{};
    if(account.nome)localStorage.setItem('oio_nome',account.nome);

    const ownAvatar=account.avatar_url;
    if(ownAvatar){
      const img=document.getElementById('identity-photo');
      img.src=ownAvatar;
      img.style.display='block';
      document.getElementById('identity-dot').style.display='block';
    }

    const frame=document.createElement('iframe');
    frame.src='teste.html';
    frame.title='OIO Core';
    document.body.appendChild(frame);

    frame.addEventListener('load',async()=>{
      try{
        const doc=frame.contentDocument;

        // LOJA: quinta aba, imediatamente antes de LIGAR.
        // O ícone é SVG Lucide inline para não depender do carregamento da biblioteca dentro do iframe.
        const menu=doc.querySelector('.menu-modulos');
        const callButton=doc.getElementById('call-btn');
        if(menu&&callButton&&!doc.getElementById('loja-btn')){
          const lojaButton=doc.createElement('button');
          lojaButton.type='button';
          lojaButton.id='loja-btn';
          lojaButton.className='btn-modulo';
          lojaButton.setAttribute('aria-label','Loja');
          lojaButton.title='Loja';
          lojaButton.innerHTML='<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"></path><path d="M3 6h18"></path><path d="M16 10a4 4 0 0 1-8 0"></path></svg><span>LOJA</span>';
          menu.insertBefore(lojaButton,callButton);
          lojaButton.addEventListener('click',()=>{
            doc.defaultView.location.href='https://pix-parade-shop.lovable.app/';
          });
        }

        const otherAvatar=doc.getElementById('gabriela');
        if(!otherAvatar)return;

        const chatResponse=await fetch('/api/chat?limit=100',{credentials:'same-origin',cache:'no-store'});
        const chatData=await chatResponse.json().catch(()=>({}));
        const messages=Array.isArray(chatData.messages)?chatData.messages:[];
        const other=[...messages].reverse().find(m=>m.autor&&String(m.autor)!==String(account.nome)&&m.autor_oio_id);

        if(other){
          if(other.autor_avatar_url){
            otherAvatar.textContent='';
            otherAvatar.style.backgroundImage=`url("${String(other.autor_avatar_url).replace(/"/g,'\\"')}")`;
            otherAvatar.style.backgroundSize='cover';
            otherAvatar.style.backgroundPosition='center';
            otherAvatar.style.backgroundRepeat='no-repeat';
          }else{
            otherAvatar.textContent=String(other.autor).trim().charAt(0).toUpperCase()||'G';
          }
          otherAvatar.title=String(other.autor);
          otherAvatar.dataset.oioId=String(other.autor_oio_id);

          // Ponte realtime: oio-core conhece os dois OIO IDs e entrega apenas
          // essa configuração ao módulo de typing. O GIF continua local.
          const typingHost=doc.createElement('div');
          typingHost.id='oio-digitando-host';
          typingHost.setAttribute('aria-hidden','false');
          typingHost.style.cssText='position:fixed;left:18px;right:18px;bottom:105px;z-index:25;pointer-events:none;min-height:0;';
          doc.body.appendChild(typingHost);

          const typingStyle=doc.createElement('style');
          typingStyle.textContent='.oio-digitando{display:inline-flex;align-items:center;gap:8px;max-width:90%;padding:7px 12px;border:1px solid rgba(36,31,26,.14);border-radius:18px;background:rgba(165,165,141,.96);color:#241f1a;font:600 12px/1.2 sans-serif;box-shadow:0 2px 8px rgba(36,31,26,.08);}.oio-digitando-pombo{flex:0 0 auto;}';
          doc.head.appendChild(typingStyle);

          doc.defaultView.__OIO_DIGITANDO_CONFIG__={
            container:typingHost,
            nome:String(other.autor),
            input:doc.getElementById('msg-input'),
            meuOioId:String(account.oio_id),
            destinatarioOioId:String(other.autor_oio_id)
          };

          const typingModule=doc.createElement('script');
          typingModule.type='module';
          typingModule.textContent=`import { conectarDigitandoAbly } from '/assets/js/digitando.js';\nconst config=window.__OIO_DIGITANDO_CONFIG__;\nif(config?.container&&config?.input&&config?.meuOioId&&config?.destinatarioOioId){\n  try{\n    window.__oioDigitandoAbly=await conectarDigitandoAbly(config);\n    console.log('OIO Ably typing conectado:',config.meuOioId,'→',config.destinatarioOioId);\n  }catch(error){\n    console.error('OIO Ably typing initialization error:',error);\n  }\n}`;
          doc.body.appendChild(typingModule);
        }
      }catch(error){
        console.error('OIO Core contact/navigation bridge error:',error);
      }
    });

    document.getElementById('loading').remove();
  }catch(error){
    console.error('OIO Core identity error:',error);
    window.location.replace('oio-id-entry.html');
  }
})();
</script>
</body>
</html>
