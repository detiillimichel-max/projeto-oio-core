<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OIO CONNECT</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#00f2fe">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: sans-serif; overflow: hidden; }
        .contatos-topo { display: flex; gap: 15px; padding: 15px; position: sticky; top: 0; z-index: 10; background: linear-gradient(to bottom, rgba(0, 242, 254, 0.15), transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid rgba(0, 242, 254, 0.2); }
        .avatar { width: 60px; height: 60px; border-radius: 50%; border: 2px solid #00f2fe; object-fit: cover; box-shadow: 0 0 15px rgba(0, 242, 254, 0.5); }
        #caixa-msg { height: calc(100vh - 160px); overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth; }
        .msg { padding: 12px; border-radius: 18px; max-width: 75%; line-height: 1.4; font-size: 15px; }
        .minha { align-self: flex-end; background: #00f2fe; color: #000; font-weight: 500; }
        .outra { align-self: flex-start; background: #1a1a1a; border: 1px solid #333; color: #fff; }
        .controles { position: fixed; bottom: 0; width: 100%; padding: 10px; background: #000; display: flex; gap: 10px; border-top: 1px solid #222; box-sizing: border-box; align-items: center; }
        input { flex: 1; padding: 12px; border-radius: 25px; border: 1px solid #333; background: #111; color: #fff; outline: none; }
        .btn-midia { background: none; border: none; font-size: 20px; color: #00f2fe; }
        .btn-enviar { background: #00f2fe; border: none; border-radius: 50%; width: 45px; height: 45px; color: #000; font-size: 20px; }
        .nav-hub { position: fixed; bottom: 70px; left: 50%; transform: translateX(-50%); background: rgba(0, 242, 254, 0.1); padding: 5px 20px; border-radius: 20px; border: 1px solid #00f2fe; font-size: 11px; color: #00f2fe; }
    </style>
</head>
<body>
    <div class="contatos-topo">
        <img src="sua-foto.jpg" class="avatar" alt="Michel">
        <img src="foto-gabriela.jpg" class="avatar" alt="Gabriela">
    </div>
    <div id="caixa-msg"></div>
    <div class="nav-hub" onclick="window.location.href='vibe_hub.html'">✨ ARCADE & VÍDEOS</div>
    <div class="controles">
        <button class="btn-midia" onclick="alert('Câmera Ativa ⭐')">📷</button>
        <button class="btn-midia" onclick="alert('Gravando Áudio ⭐')">🎤</button>
        <input id="input-msg" placeholder="Sua vibe...">
        <button class="btn-enviar" onclick="enviar()">✈️</button>
    </div>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBG3oBoBvOwySN04gR0CgCCXToZ0G-av60",
            authDomain: "vibe-app-bbba2.firebaseapp.com",
            databaseURL: "https://vibe-app-bbba2-default-rtdb.firebaseio.com/",
            projectId: "vibe-app-bbba2",
            storageBucket: "vibe-app-bbba2.appspot.com",
            messagingSenderId: "329513213082",
            appId: "1:329513213082:web:3938e86538f8a04a05323"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        window.addEventListener('load', () => {
            if (!localStorage.getItem('boas_vindas_oio')) {
                setTimeout(() => {
                    if (navigator.vibrate) navigator.vibrate([100, 200]);
                    new Audio('https://www.soundjay.com/buttons/sounds/button-09a.mp3').play();
                    const div = document.createElement("div");
                    div.className = "msg outra";
                    div.style.border = "1px solid #00f2fe";
                    div.innerHTML = "<strong>Estrela ⭐</strong><br>Bem-vindo ao OIO ONE! A interface orgânica está ativa. 🚀";
                    document.getElementById("caixa-msg").appendChild(div);
                    localStorage.setItem('boas_vindas_oio', 'true');
                }, 2000);
            }
        });

        db.ref("chat_geral").limitToLast(20).on("child_added", snap => {
            const m = snap.val();
            const div = document.createElement("div");
            div.className = `msg ${m.autor === "Michel" ? 'minha' : 'outra'}`;
            div.innerHTML = `<strong>${m.autor}</strong><br>${m.texto}`;
            document.getElementById("caixa-msg").appendChild(div);
            document.getElementById("caixa-msg").scrollTop = 99999;
        });

        function enviar() {
            const campo = document.getElementById("input-msg");
            if(campo.value.trim()) {
                db.ref("chat_geral").push({ autor: "Michel", texto: campo.value, data: Date.now() });
                campo.value = "";
                if(navigator.vibrate) navigator.vibrate(50);
            }
        }
    </script>
</body>
</html>
