<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OIO CONNECT</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: sans-serif; overflow: hidden; }
        
        /* CAMADA 1: Identidade (Contatos fixos no topo) */
        .contatos-topo { 
            display: flex; gap: 15px; padding: 15px; background: rgba(0,0,0,0.9);
            border-bottom: 1px solid #222; position: sticky; top: 0; z-index: 10;
        }
        .avatar { 
            width: 60px; height: 60px; border-radius: 50%; border: 2px solid #00f2fe; 
            object-fit: cover; box-shadow: 0 0 10px #00f2fe;
        }

        /* CAMADA 2: Mensagens (Deslizam por baixo) */
        #caixa-msg { 
            height: calc(100vh - 160px); overflow-y: auto; padding: 15px;
            display: flex; flex-direction: column; gap: 10px;
        }
        .msg { padding: 12px; border-radius: 15px; max-width: 80%; line-height: 1.4; }
        .minha { align-self: flex-end; background: #00f2fe; color: #000; }
        .outra { align-self: flex-start; background: #1a1a1a; border: 1px solid #333; }

        .controles { padding: 10px; display: flex; gap: 10px; background: #000; }
        input { flex: 1; padding: 12px; border-radius: 25px; border: 1px solid #333; background: #111; color: #fff; }
    </style>
</head>
<body>

    <div class="contatos-topo">
        <img src="sua-foto.jpg" class="avatar" loading="lazy" alt="Michel">
        <img src="foto-gabriela.jpg" class="avatar" loading="lazy" alt="Gabriela">
    </div>

    <div id="caixa-msg"></div>

    <div class="controles">
        <input id="input-msg" placeholder="Sua vibe...">
        <button onclick="enviar()" style="background:#00f2fe; border:none; border-radius:50%; width:45px;">✈️</button>
    </div>

        <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBG3oBoBvOwySN04gR0CgCCXToZ0G-av60",
            authDomain: "vibe-app-bbba2.firebaseapp.com",
            databaseURL: "https://vibe-app-bbba2-default-rtdb.firebaseio.com/",
            projectId: "vibe-app-bbba2",
            storageBucket: "vibe-app-bbba2.appspot.com",
            messagingSenderId: "329513213082",
            appId: "1:329513213082:web:3938e86538f8a04a05323"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
            

        // OTIMIZAÇÃO: BUSCA APENAS AS ÚLTIMAS 20 MENSAGENS
        db.ref("chat_geral").limitToLast(20).on("child_added", snap => {
            const m = snap.val();
            const div = document.createElement("div");
            div.className = `msg ${m.autor === "Michel" ? 'minha' : 'outra'}`;
            div.innerHTML = `<strong>${m.autor}</strong><br>${m.texto}`;
            document.getElementById("caixa-msg").appendChild(div);
            document.getElementById("caixa-msg").scrollTop = 99999;
        });

        function enviar() {
            const txt = document.getElementById("input-msg").value;
            if(txt) {
                db.ref("chat_geral").push({ autor: "Michel", texto: txt, data: Date.now() });
                document.getElementById("input-msg").value = "";
                if(navigator.vibrate) navigator.vibrate(50); // VIBRAÇÃO NATIVA
            }
        }
    </script>
</body>
</html>
