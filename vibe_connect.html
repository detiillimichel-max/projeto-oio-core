<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OIO CONNECT</title>
        <title>OIO CONNECT</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#00f2fe">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: sans-serif; overflow: hidden; }
        
        /* CAMADA 1: Identidade (Topo com efeito de vidro e profundidade) */
        .contatos-topo { 
            display: flex; gap: 15px; padding: 15px; 
            position: sticky; top: 0; z-index: 10;
            background: linear-gradient(to bottom, rgba(0, 242, 254, 0.15), transparent);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0, 242, 254, 0.2);
        }
        .avatar { 
            width: 60px; height: 60px; border-radius: 50%; border: 2px solid #00f2fe; 
            object-fit: cover; box-shadow: 0 0 15px rgba(0, 242, 254, 0.5);
        }

        /* CAMADA 2: Mensagens (Deslizam por baixo do topo) */
        #caixa-msg { 
            height: calc(100vh - 150px); overflow-y: auto; padding: 15px;
            display: flex; flex-direction: column; gap: 12px;
            scroll-behavior: smooth;
        }
        .msg { padding: 12px; border-radius: 18px; max-width: 75%; line-height: 1.4; font-size: 15px; box-shadow: 2px 2px 10px rgba(0,0,0,0.5); }
        .minha { align-self: flex-end; background: #00f2fe; color: #000; font-weight: 500; }
        .outra { align-self: flex-start; background: #1a1a1a; border: 1px solid #333; color: #fff; }

        /* Barra de Digitação Fixa Embaixo */
        .controles { 
            position: fixed; bottom: 0; width: 100%;
            padding: 10px; display: flex; gap: 10px; background: #000; 
            border-top: 1px solid #222; box-sizing: border-box;
        }
        input { 
            flex: 1; padding: 12px 20px; border-radius: 25px; 
            border: 1px solid #333; background: #111; color: #fff; outline: none;
        }
        .btn-enviar {
            background: #00f2fe; border: none; border-radius: 50%; 
            width: 45px; height: 45px; color: #000; font-size: 20px;
            display: flex; align-items: center; justify-content: center;
        }

        /* Menu de Navegação para o HUB */
        .nav-hub {
            position: fixed; bottom: 65px; left: 50%; transform: translateX(-50%);
            background: rgba(26, 26, 26, 0.8); padding: 5px 20px; border-radius: 20px;
            border: 1px solid #333; font-size: 12px; color: #00f2fe; text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="contatos-topo">
        <img src="sua-foto.jpg" class="avatar" loading="lazy" alt="Michel">
        <img src="foto-gabriela.jpg" class="avatar" loading="lazy" alt="Gabriela">
    </div>

    <div id="caixa-msg"></div>

    <div class="nav-hub" onclick="window.location.href='vibe_hub.html'">
        ✨ Abrir Arcade & Vídeos
    </div>

    <div class="controles">
        <input id="input-msg" placeholder="Sua vibe...">
        <button class="btn-enviar" onclick="enviar()">✈️</button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBG3oBoBvOwySN04gR0CgCCXToZ0G-av60",
            authDomain: "vibe-app-bbba2.firebaseapp.com",
            databaseURL: "https://vibe-app-bbba2-default-rtdb.firebaseio.com/",
            projectId: "vibe-app-bbba2",
            storageBucket: "vibe-app-bbba2.appspot.com",
            messagingSenderId: "329513213082",
            appId: "1:329513213082:web:3938e86538f8a04a05323"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
// MENSAGEM DE BOAS-VINDAS DA ESTRELA ⭐
window.addEventListener('load', () => {
    if (!localStorage.getItem('boas_vindas_oio')) {
        setTimeout(() => {
            // Sinal da Estrela (Som + Vibração Nativa)
            if (navigator.vibrate) navigator.vibrate([100, 200, 100]);
            const somEstrela = new Audio('https://www.soundjay.com/buttons/sounds/button-09a.mp3');
            somEstrela.play();

            // Mensagem automática no Chat
            const msgBoasVindas = {
                autor: "Estrela ⭐",
                texto: "Bem-vindo ao OIO ONE, Michel! A interface orgânica está ativa. Suas memórias e vibrações viajam agora por aqui. 🚀",
                data: Date.now()
            };
            
            // Exibe na tela apenas para o usuário atual ver
            const div = document.createElement("div");
            div.className = "msg outra";
            div.style.border = "1px solid #00f2fe"; // Destaque da Estrela
            div.innerHTML = `<strong>${msgBoasVindas.autor}</strong><br>${msgBoasVindas.texto}`;
            document.getElementById("caixa-msg").appendChild(div);
            
            localStorage.setItem('boas_vindas_oio', 'true');
        }, 2000); // Aparece 2 segundos após abrir
    }
});
        
        // OTIMIZAÇÃO: BUSCA APENAS AS ÚLTIMAS 20 MENSAGENS
        db.ref("chat_geral").limitToLast(20).on("child_added", snap => {
            const m = snap.val();
            const div = document.createElement("div");
            div.className = `msg ${m.autor === "Michel" ? 'minha' : 'outra'}`;
            div.innerHTML = `<strong>${m.autor}</strong><br>${m.texto}`;
            document.getElementById("caixa-msg").appendChild(div);
            document.getElementById("caixa-msg").scrollTop = 99999;
        });

        function enviar() {
            const campo = document.getElementById("input-msg");
            const txt = campo.value;
            if(txt) {
                db.ref("chat_geral").push({ autor: "Michel", texto: txt, data: Date.now() });
                campo.value = "";
                if(navigator.vibrate) navigator.vibrate(50); // VIBRAÇÃO NATIVA
            }
        }
    </script>
</body>
</html>
