<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OIO CONNECT - Vercel PRO</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#00f2fe">
    <meta name="apple-mobile-web-app-capable" content="yes">
    
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>

    <style>
        body { margin: 0; background: #000; color: #fff; font-family: sans-serif; height: 100dvh; overflow: hidden; display: flex; flex-direction: column; }
        
        /* CAMADA 1: Identidade (Topo) */
        .contatos-topo { display: flex; gap: 15px; padding: 15px; background: rgba(0, 242, 254, 0.1); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(0, 242, 254, 0.2); z-index: 10; }
        .avatar { width: 55px; height: 55px; border-radius: 50%; border: 2px solid #00f2fe; box-shadow: 0 0 10px #00f2fe; }

        /* CAMADA 2: Mensagens */
        #caixa-msg { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; padding-bottom: 80px; scroll-behavior: smooth; }
        .msg { padding: 12px 16px; border-radius: 20px; max-width: 80%; font-size: 15px; line-height: 1.4; }
        .minha { align-self: flex-end; background: #00f2fe; color: #000; font-weight: bold; border-bottom-right-radius: 2px; }
        .outra { align-self: flex-start; background: #1a1a1a; border: 1px solid #333; border-bottom-left-radius: 2px; }

        /* GAVETA DE VIDRO (CONTROLES) */
        .controles { position: fixed; bottom: 0; width: 100%; padding: 12px; background: rgba(0,0,0,0.9); backdrop-filter: blur(15px); display: flex; gap: 10px; align-items: center; border-top: 1px solid #222; }
        .btn-acao { background: none; border: none; font-size: 24px; color: #00f2fe; cursor: pointer; padding: 5px; }
        input { flex: 1; background: #111; border: 1px solid #333; padding: 12px 18px; border-radius: 25px; color: #fff; outline: none; font-size: 16px; }
        .btn-enviar { width: 45px; height: 45px; border-radius: 50%; border: none; background: #00f2fe; color: #000; display: flex; align-items: center; justify-content: center; font-size: 20px; }

        .nav-hub { position: fixed; bottom: 75px; left: 50%; transform: translateX(-50%); background: rgba(255,255,255,0.05); padding: 6px 15px; border-radius: 20px; border: 1px solid #333; font-size: 11px; color: #00f2fe; z-index: 5; }
    </style>
</head>
<body>

    <div class="contatos-topo">
        <div class="avatar" style="background: url('sua-foto.jpg') center/cover;"></div>
        <div class="avatar" style="background: url('foto-gabriela.jpg') center/cover;"></div>
    </div>

    <div id="caixa-msg"></div>

    <div class="nav-hub" onclick="window.location.href='vibe_hub.html'">✨ ARCADE & VÍDEOS</div>

    <div class="controles">
        <button class="btn-acao" onclick="document.getElementById('file-input').click()">📷</button>
        <button class="btn-acao" onclick="alert('Gravando Áudio Orgânico...')">🎤</button>
        <input id="input-msg" placeholder="Sua vibe..." autocomplete="off">
        <button class="btn-enviar" onclick="enviar()">✈️</button>
    </div>

    <input type="file" id="file-input" style="display:none" accept="image/*">

    <script>
        const config = {
            apiKey: "AIzaSyBG3oBoBvOwySN04gR0CgCCXToZ0G-av60",
            authDomain: "vibe-app-bbba2.firebaseapp.com",
            databaseURL: "https://vibe-app-bbba2-default-rtdb.firebaseio.com/",
            projectId: "vibe-app-bbba2",
            storageBucket: "vibe-app-bbba2.appspot.com",
            messagingSenderId: "329513213082",
            appId: "1:329513213082:web:3938e86538f8a04a05323"
        };
        firebase.initializeApp(config);
        const db = firebase.database();

        let meuNome = localStorage.getItem("oio_nome") || "Michel";

        // ESCUTAR MENSAGENS
        db.ref("chat_geral").limitToLast(20).on("child_added", snap => {
            const m = snap.val();
            const caixa = document.getElementById("caixa-msg");
            const div = document.createElement("div");
            div.className = `msg ${m.autor === meuNome ? 'minha' : 'outra'}`;
            div.innerHTML = `<strong>${m.autor}</strong><br>${m.texto}`;
            caixa.appendChild(div);
            caixa.scrollTop = caixa.scrollHeight;
            
            if(m.autor !== meuNome && navigator.vibrate) navigator.vibrate(100);
        });

        function enviar() {
            const input = document.getElementById("input-msg");
            if(input.value.trim()) {
                db.ref("chat_geral").push({
                    autor: meuNome,
                    texto: input.value,
                    data: Date.now()
                });
                input.value = "";
                if(navigator.vibrate) navigator.vibrate(50);
            }
        }

        // GALERIA
        document.getElementById('file-input').onchange = e => {
            alert("Imagem selecionada! A Estrela ⭐ está preparando o envio...");
        };
    </script>
</body>
</html>
