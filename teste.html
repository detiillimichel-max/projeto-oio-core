<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>OIO ONE - V5 PRO</title>
<link rel="icon" href="icone-512.png">
<link rel="manifest" href="manifest.json">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root{--bg:#E8E5DF;--surface:#968F83;--surface-soft:#A5A58D;--sent:#A49A87;--received:#A5A58D;--text:#241f1a;--muted:#625c54;--border:rgba(36,31,26,.18);--accent:#C4C4C4;--accent-dark:#968F83}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:sans-serif;height:100dvh;overflow:hidden;display:flex;flex-direction:column}.header-identidade{padding:20px;display:flex;gap:15px;overflow-x:auto;border-bottom:1px solid var(--border);flex-shrink:0;background:var(--bg);border-top:8px solid var(--accent)}.user-avatar{width:60px;height:60px;border-radius:50%;border:2px solid var(--accent-dark);background:var(--surface-soft);color:var(--text);display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative}.user-avatar svg{width:28px;height:28px;stroke-width:1.8}.user-avatar.online:after{content:'';position:absolute;bottom:2px;right:2px;width:12px;height:12px;background:#3c8a42;border-radius:50%;border:2px solid var(--bg)}#area-principal{flex:1;min-height:0;overflow-y:auto;padding:15px 15px 200px;display:flex;flex-direction:column;gap:10px}.balao{padding:12px 14px;border-radius:18px;max-width:80%;font-size:15px;line-height:1.4;overflow-wrap:anywhere;color:var(--text);border:1px solid rgba(36,31,26,.12);box-shadow:0 2px 8px rgba(36,31,26,.08);background:var(--received);align-self:flex-start}.balao.minha{align-self:flex-end;background:var(--sent);border-color:rgba(36,31,26,.15)}.balao strong{color:#211d18}.balao audio{display:block;width:min(260px,100%);height:38px;margin-top:8px}.balao img{display:block;width:min(320px,100%);max-height:420px;object-fit:cover;border-radius:14px;margin-top:8px}.status{align-self:center;color:var(--muted);font-size:12px;text-align:center;padding:8px}.gaveta-vidro{position:fixed;z-index:10;bottom:0;left:0;width:100%;background:rgba(232,229,223,.94);backdrop-filter:blur(20px);border-top:1px solid var(--border);border-radius:25px 25px 0 0;padding:15px;box-shadow:0 -8px 30px rgba(36,31,26,.12)}.input-row{display:flex;gap:10px;align-items:center;margin-bottom:8px}.input-row.photo-ready{align-items:center}.photo-compose{display:none;align-items:center;gap:9px;flex:1;min-width:0;background:#fffdf9;border:1px solid var(--border);padding:5px 8px;border-radius:18px;height:55px}.photo-compose img{width:45px;height:45px;object-fit:cover;border-radius:12px;flex-shrink:0}.photo-compose span{font-size:14px;color:var(--text);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.audio-preview{display:block;width:min(320px,100%);height:38px;margin:8px auto}.audio-status{max-width:100%;overflow:hidden}.audio-status .audio-preview{max-width:100%}.audio-compose{display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;margin-top:8px;border:1px solid var(--border);border-radius:16px;background:rgba(255,253,249,.6)}.audio-compose .compose-player{flex:1;min-width:0}.audio-compose .compose-actions{display:flex;align-items:center;gap:4px;flex-shrink:0}.audio-compose button{border:0;background:transparent;color:var(--muted);width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer}.audio-compose button:hover,.audio-compose button:active{color:var(--text);background:rgba(36,31,26,.06)}.audio-compose .compose-send{background:var(--surface);color:#fff}.audio-compose .compose-send:hover,.audio-compose .compose-send:active{background:var(--accent-dark);color:#fff}input{min-width:0;flex:1;background:#fffdf9;border:1px solid var(--border);padding:12px 20px;border-radius:30px;color:var(--text);outline:none}input::placeholder{color:#81796f}.send{background:var(--surface);color:#fff;border:0;width:45px;height:45px;border-radius:50%;font-weight:bold;display:flex;align-items:center;justify-content:center;flex-shrink:0}.send svg{width:20px;height:20px;stroke-width:2.5}.menu-modulos{display:flex;justify-content:space-around;padding-top:10px;border-top:1px solid var(--border)}.btn-modulo{background:none;border:0;color:var(--muted);font-size:11px;cursor:pointer;padding:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:55px}.btn-modulo svg{width:20px;height:20px;stroke-width:1.8}.btn-modulo:hover,.btn-modulo:active{color:var(--text)}#file-input,#camera-input,#gallery-input{display:none}.photo-choice{position:fixed;z-index:40;left:20px;right:20px;bottom:105px;background:rgba(232,229,223,.98);border:1px solid var(--border);border-radius:22px;padding:14px;box-shadow:0 10px 40px rgba(36,31,26,.25);display:none}.photo-choice.open{display:block}.photo-choice-title{font-weight:700;font-size:15px;margin:0 0 8px}.photo-choice button{width:100%;display:flex;align-items:center;gap:12px;padding:13px;margin:7px 0;border:1px solid var(--border);border-radius:14px;background:var(--surface-soft);color:var(--text);font-size:14px}.photo-choice button svg{width:20px}.photo-choice-close{width:100%;margin-top:8px;padding:10px;border:0;border-radius:12px;background:var(--surface);color:#fff}.arcade-menu{position:fixed;z-index:30;left:20px;right:20px;bottom:105px;background:rgba(232,229,223,.98);border:1px solid var(--border);border-radius:22px;padding:18px;box-shadow:0 10px 40px rgba(36,31,26,.25);display:none}.arcade-menu.open{display:block}.arcade-menu h3{margin:0 0 14px;font-size:16px;color:var(--text)}.arcade-link{width:100%;display:flex;align-items:center;gap:12px;padding:14px;margin:8px 0;border:1px solid var(--border);border-radius:14px;background:var(--surface-soft);color:var(--text);text-decoration:none;font-size:14px}.arcade-link svg{width:20px}.arcade-close{width:100%;margin-top:8px;padding:10px;border:0;border-radius:12px;background:var(--surface);color:#fff}.audio-btn.recording{color:#8b2f2f;font-weight:bold}
</style>
</head>
<body>
<div class="header-identidade"><div class="user-avatar online"><i data-lucide="star"></i></div><div class="user-avatar" id="gabriela">G</div></div>
<div id="area-principal"><div class="status" id="status">Conectando ao Turso...</div></div>
<div class="gaveta-vidro">
 <div class="input-row" id="input-row"><button class="btn-modulo" id="foto-btn" type="button" aria-label="Enviar foto"><i data-lucide="camera"></i></button><button class="btn-modulo audio-btn" id="audio-btn" type="button" aria-label="Gravar áudio"><i data-lucide="mic"></i></button><input id="msg-input" autocomplete="off" placeholder="Sua vibe..."><div class="photo-compose" id="photo-compose"><img id="photo-compose-img" alt="Foto selecionada"><span>Foto pronta para enviar</span></div><button class="send" id="send-btn" type="button" aria-label="Enviar mensagem"><i data-lucide="send"></i></button></div>
 <div class="status audio-status" id="audio-status" style="display:none"></div>
 <div class="menu-modulos"><button class="btn-modulo" id="chat-btn" aria-label="Chat"><i data-lucide="message-circle"></i><span>CHAT</span></button><button class="btn-modulo" id="videos-btn" aria-label="Vídeos"><i data-lucide="clapperboard"></i><span>VÍDEOS</span></button><button class="btn-modulo" id="games-btn" aria-label="Arcade"><i data-lucide="gamepad-2"></i><span>ARCADE</span></button><button class="btn-modulo" id="call-btn" aria-label="Ligar"><i data-lucide="phone"></i><span>LIGAR</span></button></div>
</div>
<div class="photo-choice" id="photo-choice"><div class="photo-choice-title">Adicionar foto</div><button id="camera-choice" type="button"><i data-lucide="camera"></i><span>Tirar foto</span></button><button id="gallery-choice" type="button"><i data-lucide="image"></i><span>Escolher da galeria</span></button><button class="photo-choice-close" id="photo-choice-close" type="button">Fechar</button></div>
<div class="arcade-menu" id="arcade-menu">
 <h3>ARCADE</h3>
 <a class="arcade-link" href="https://detiillimichel-max.github.io/hubs-de-jogos/" target="_blank" rel="noopener"><i data-lucide="gamepad-2"></i><span>Hubs de Jogos</span></a>
 <a class="arcade-link" href="https://detiillimichel-max.github.io/-Neural-iA/?v1" target="_blank" rel="noopener"><i data-lucide="brain"></i><span>Neural iA</span></a>
 <button class="arcade-close" id="arcade-close" type="button">Fechar</button>
</div>
<input type="file" id="camera-input" accept="image/*" capture="environment">
<input type="file" id="gallery-input" accept="image/*">
<input type="file" id="file-input" accept="image/*">
<audio id="som-notifica" preload="auto" src="https://www.soundjay.com/buttons/sounds/button-50.mp3"></audio>
<script>
(()=>{
'use strict';
const area=document.getElementById('area-principal'),status=document.getElementById('status'),input=document.getElementById('msg-input'),audio=document.getElementById('som-notifica'),photoChoice=document.getElementById('photo-choice'),cameraInput=document.getElementById('camera-input'),galleryInput=document.getElementById('gallery-input'),photoCompose=document.getElementById('photo-compose'),photoComposeImg=document.getElementById('photo-compose-img'),inputRow=document.getElementById('input-row'),arcadeMenu=document.getElementById('arcade-menu'),sendBtn=document.getElementById('send-btn');
const API='/api/chat';
const CLOUDINARY_CLOUD_NAME='hmnhqfco';
const CLOUDINARY_PHOTO_PRESET='oio_core_fotos_upload';
const CLOUDINARY_PHOTO_UPLOAD_URL=`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`;
let meuNome=localStorage.getItem('oio_nome'); let ultimoId=0; let carregando=false;
if(!meuNome){meuNome=prompt('Nome OIO ONE:')||'Michel';localStorage.setItem('oio_nome',meuNome)}
function mostrarStatus(t){status.textContent=t;status.style.display=t?'block':'none'}
function mostrarPhotoCompose(url){photoComposeImg.src=url;photoCompose.style.display='flex';input.style.display='none';inputRow.classList.add('photo-ready');sendBtn.setAttribute('aria-label','Enviar foto');}
function limparPhotoCompose(){photoComposeImg.removeAttribute('src');photoCompose.style.display='none';input.style.display='';inputRow.classList.remove('photo-ready');sendBtn.setAttribute('aria-label','Enviar mensagem');}
function mensagem(m,notificar=false){if(document.querySelector(`[data-id="${m.id}"]`))return;const d=document.createElement('div');d.className='balao'+(m.autor===meuNome?' minha':'');d.dataset.id=m.id;const a=document.createElement('strong');a.textContent=m.autor||'Usuário';d.append(a,document.createElement('br'));
if(m.media_url){const tipo=String(m.media_type||'').toLowerCase();if(tipo.startsWith('image/')||tipo==='image'){const img=document.createElement('img');img.src=m.media_url;img.alt='Foto enviada';img.loading='lazy';d.appendChild(img)}else{const player=document.createElement('audio');player.controls=true;player.preload='metadata';player.src=m.media_url;d.appendChild(player)}if(m.texto){d.append(document.createElement('br'),document.createTextNode(m.texto))}}
else d.appendChild(document.createTextNode(m.texto||''));area.appendChild(d);area.scrollTop=area.scrollHeight;if(notificar&&m.autor!==meuNome){audio.currentTime=0;audio.play().catch(()=>{})}}
async function carregar(inicial=false){if(carregando)return;carregando=true;try{const url=inicial?`${API}?limit=30`:`${API}?since=${ultimoId}&limit=30`;const r=await fetch(url,{cache:'no-store'});const data=await r.json();if(!r.ok)throw new Error(data.error||'Erro HTTP '+r.status);for(const m of data.messages||[]){mensagem(m,!inicial);ultimoId=Math.max(ultimoId,Number(m.id)||0)}mostrarStatus('')}catch(e){console.error(e);mostrarStatus('Turso não está conectado. Configure os secrets na Vercel.')}finally{carregando=false}}
async function enviar(){
 const texto=input.value.trim();const audioData=window.oioPendingAudio;const photoData=window.oioPendingPhoto;
 if(!texto&&!audioData&&!photoData)return;sendBtn.disabled=true;input.disabled=true;
 try{const body=audioData?{autor:meuNome,texto,media_url:audioData.url,media_public_id:audioData.publicId,media_type:audioData.mimeType||audioData.resourceType,media_duration:audioData.duration}:photoData?{autor:meuNome,texto,media_url:photoData.url,media_public_id:photoData.publicId,media_type:photoData.mimeType}:{autor:meuNome,texto};const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await r.json();if(!r.ok)throw new Error(data.error||'Falha ao enviar');mensagem(data.message);ultimoId=Math.max(ultimoId,Number(data.message.id)||0);input.value='';window.oioPendingAudio=null;window.oioPendingPhoto=null;limparPhotoCompose();window.dispatchEvent(new CustomEvent('oio:audio-sent'));window.dispatchEvent(new CustomEvent('oio:photo-sent'));input.focus()}catch(e){console.error(e);mostrarStatus('Não foi possível enviar. Verifique o Turso/Vercel.')}finally{sendBtn.disabled=false;input.disabled=false}}
sendBtn.onclick=enviar;input.onkeydown=e=>{if(e.key==='Enter')enviar()};
window.addEventListener('oio:audio-ready',()=>{sendBtn.setAttribute('aria-label','Enviar áudio');input.placeholder='Áudio pronto — use o enviar ➤';input.focus()});window.addEventListener('oio:audio-sent',()=>{input.placeholder='Sua vibe...' });
window.addEventListener('oio:photo-ready',()=>{sendBtn.setAttribute('aria-label','Enviar foto');input.placeholder='Foto pronta — use o enviar ➤';input.focus()});window.addEventListener('oio:photo-sent',()=>{input.placeholder='Sua vibe...' });
document.getElementById('chat-btn').onclick=()=>{arcadeMenu.classList.remove('open');photoChoice.classList.remove('open');area.scrollTop=area.scrollHeight;input.focus()};document.getElementById('videos-btn').onclick=()=>location.href='vibe.html';document.getElementById('games-btn').onclick=()=>{photoChoice.classList.remove('open');arcadeMenu.classList.toggle('open')};document.getElementById('arcade-close').onclick=()=>arcadeMenu.classList.remove('open');document.getElementById('call-btn').onclick=()=>location.href='tel:+5511999999999';document.getElementById('gabriela').onclick=()=>alert('Abrindo Gabriela...');
document.getElementById('foto-btn').onclick=()=>{arcadeMenu.classList.remove('open');photoChoice.classList.toggle('open')};document.getElementById('camera-choice').onclick=()=>{photoChoice.classList.remove('open');cameraInput.click()};document.getElementById('gallery-choice').onclick=()=>{photoChoice.classList.remove('open');galleryInput.click()};document.getElementById('photo-choice-close').onclick=()=>photoChoice.classList.remove('open');
async function processarFoto(file){if(!file)return;if(!/^image\/(jpeg|png|webp)$/.test(file.type)){mostrarStatus('Formato não permitido. Use JPG, PNG ou WebP.');return}if(file.size>10*1024*1024){mostrarStatus('Imagem muito grande. Limite: 10 MB.');return}sendBtn.disabled=true;mostrarStatus('Enviando foto para o Cloudinary...');try{const form=new FormData();form.append('file',file);form.append('upload_preset',CLOUDINARY_PHOTO_PRESET);const r=await fetch(CLOUDINARY_PHOTO_UPLOAD_URL,{method:'POST',body:form});const data=await r.json();if(!r.ok||!data.secure_url)throw new Error(data.error?.message||'Falha no upload da foto');window.oioPendingPhoto={url:data.secure_url,publicId:data.public_id||'',mimeType:file.type};mostrarStatus('');mostrarPhotoCompose(data.secure_url);window.dispatchEvent(new CustomEvent('oio:photo-ready'))}catch(e){console.error(e);mostrarStatus('Não foi possível enviar a foto para o Cloudinary.');window.oioPendingPhoto=null}finally{sendBtn.disabled=false}}
cameraInput.onchange=()=>{const file=cameraInput.files&&cameraInput.files[0];processarFoto(file);cameraInput.value=''};galleryInput.onchange=()=>{const file=galleryInput.files&&galleryInput.files[0];processarFoto(file);galleryInput.value=''};
document.addEventListener('pointerdown',()=>{audio.play().then(()=>{audio.pause();audio.currentTime=0}).catch(()=>{})},{once:true});if(window.lucide)lucide.createIcons();carregar(true);setInterval(()=>carregar(false),2000);
})();
</script>
<script src="assets/js/audio-recorder.js"></script>
<script src="assets/js/oio-notifications.js"></script>
</body>
</html>
