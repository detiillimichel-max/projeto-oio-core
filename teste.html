<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>OIO ONE - V5 PRO</title>
<link rel="icon" href="icone-512.png">
<link rel="manifest" href="manifest.json">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root{--accent:#00f2fe}*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font-family:sans-serif;height:100dvh;overflow:hidden;display:flex;flex-direction:column}.header-identidade{padding:20px;display:flex;gap:15px;overflow-x:auto;border-bottom:1px solid #222;flex-shrink:0}.user-avatar{width:60px;height:60px;border-radius:50%;border:2px solid var(--accent);background:#111;display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative}.user-avatar svg{width:28px;height:28px;stroke-width:1.8}.user-avatar.online:after{content:'';position:absolute;bottom:2px;right:2px;width:12px;height:12px;background:#0f0;border-radius:50%;border:2px solid #000}#area-principal{flex:1;min-height:0;overflow-y:auto;padding:15px 15px 180px;display:flex;flex-direction:column;gap:10px}.balao{padding:12px;border-radius:18px;max-width:80%;font-size:15px;line-height:1.4;border-left:4px solid var(--accent);background:rgba(0,242,254,.05);overflow-wrap:anywhere}.minha{align-self:flex-end;border-left:none;border-right:4px solid #fff;background:rgba(255,255,255,.05)}.status{align-self:center;color:#777;font-size:12px;text-align:center;padding:8px}.gaveta-vidro{position:fixed;z-index:10;bottom:0;left:0;width:100%;background:rgba(20,20,20,.92);backdrop-filter:blur(20px);border-top:1px solid rgba(255,255,255,.1);border-radius:25px 25px 0 0;padding:15px}.input-row{display:flex;gap:10px;align-items:center;margin-bottom:15px}input{min-width:0;flex:1;background:#222;border:none;padding:12px 20px;border-radius:30px;color:#fff;outline:none}.send{background:var(--accent);color:#000;border:0;width:45px;height:45px;border-radius:50%;font-weight:bold;display:flex;align-items:center;justify-content:center}.send svg{width:20px;height:20px;stroke-width:2.5}.menu-modulos{display:flex;justify-content:space-around;padding-top:10px;border-top:1px solid #333}.btn-modulo{background:none;border:0;color:#aaa;font-size:11px;cursor:pointer;padding:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:55px}.btn-modulo svg{width:20px;height:20px;stroke-width:1.8}.btn-modulo:hover,.btn-modulo:active{color:var(--accent)}#file-input{display:none}
</style>
</head>
<body>
<div class="header-identidade"><div class="user-avatar online"><i data-lucide="star"></i></div><div class="user-avatar" id="gabriela">G</div></div>
<div id="area-principal"><div class="status" id="status">Conectando ao Turso...</div></div>
<div class="gaveta-vidro">
 <div class="input-row"><button class="btn-modulo" id="foto-btn" type="button" aria-label="Enviar foto"><i data-lucide="camera"></i></button><input id="msg-input" autocomplete="off" placeholder="Sua vibe..."><button class="send" id="send-btn" type="button" aria-label="Enviar mensagem"><i data-lucide="send"></i></button></div>
 <div class="menu-modulos"><button class="btn-modulo" id="chat-btn" aria-label="Chat"><i data-lucide="message-circle"></i><span>CHAT</span></button><button class="btn-modulo" id="videos-btn" aria-label="Vídeos"><i data-lucide="clapperboard"></i><span>VÍDEOS</span></button><button class="btn-modulo" id="games-btn" aria-label="Arcade"><i data-lucide="gamepad-2"></i><span>ARCADE</span></button><button class="btn-modulo" id="call-btn" aria-label="Ligar"><i data-lucide="phone"></i><span>LIGAR</span></button></div>
</div>
<input type="file" id="file-input" accept="image/*">
<audio id="som-notifica" preload="auto" src="https://www.soundjay.com/buttons/sounds/button-50.mp3"></audio>
<script>
(()=>{
'use strict';
const area=document.getElementById('area-principal'),status=document.getElementById('status'),input=document.getElementById('msg-input'),audio=document.getElementById('som-notifica'),fileInput=document.getElementById('file-input');
const API='/api/chat'; let meuNome=localStorage.getItem('oio_nome'); let ultimoId=0; let carregando=false;
if(!meuNome){meuNome=prompt('Nome OIO ONE:')||'Michel';localStorage.setItem('oio_nome',meuNome)}
function mostrarStatus(t){status.textContent=t;status.style.display=t?'block':'none'}
function mensagem(m,notificar=false){if(document.querySelector(`[data-id="${m.id}"]`))return;const d=document.createElement('div');d.className='balao'+(m.autor===meuNome?' minha':'');d.dataset.id=m.id;const a=document.createElement('strong');a.textContent=m.autor||'Usuário';d.append(a,document.createElement('br'),document.createTextNode(m.texto||''));area.appendChild(d);area.scrollTop=area.scrollHeight;if(notificar&&m.autor!==meuNome){audio.currentTime=0;audio.play().catch(()=>{})}}
async function carregar(inicial=false){if(carregando)return;carregando=true;try{const url=inicial?`${API}?limit=30`:`${API}?since=${ultimoId}&limit=30`;const r=await fetch(url,{cache:'no-store'});const data=await r.json();if(!r.ok)throw new Error(data.error||'Erro HTTP '+r.status);for(const m of data.messages||[]){mensagem(m,!inicial);ultimoId=Math.max(ultimoId,Number(m.id)||0)}mostrarStatus('')}catch(e){console.error(e);mostrarStatus('Turso não está conectado. Configure os secrets na Vercel.')}finally{carregando=false}}
async function enviar(){const texto=input.value.trim();if(!texto)return;input.disabled=true;try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({autor:meuNome,texto})});const data=await r.json();if(!r.ok)throw new Error(data.error||'Falha ao enviar');mensagem(data.message);ultimoId=Math.max(ultimoId,Number(data.message.id)||0);input.value='';input.focus()}catch(e){console.error(e);mostrarStatus('Não foi possível enviar. Verifique o Turso/Vercel.')}finally{input.disabled=false}}
document.getElementById('send-btn').onclick=enviar;input.onkeydown=e=>{if(e.key==='Enter')enviar()};document.getElementById('chat-btn').onclick=()=>{area.scrollTop=area.scrollHeight;input.focus()};document.getElementById('videos-btn').onclick=()=>location.href='videos.html';document.getElementById('games-btn').onclick=()=>location.href='games.html';document.getElementById('call-btn').onclick=()=>location.href='tel:+5511999999999';document.getElementById('gabriela').onclick=()=>alert('Abrindo Gabriela...');document.getElementById('foto-btn').onclick=()=>fileInput.click();fileInput.onchange=()=>{if(fileInput.files.length){mostrarStatus('Upload de imagem será ligado ao Cloudinary nesta próxima etapa.');fileInput.value=''}};document.addEventListener('pointerdown',()=>{audio.play().then(()=>{audio.pause();audio.currentTime=0}).catch(()=>{})},{once:true});
if(window.lucide)lucide.createIcons();
carregar(true);setInterval(()=>carregar(false),2000);
})();
</script>
</body>
</html>
