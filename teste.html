<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>OIO ONE - V5 PRO</title>
<link rel="icon" href="icone-512.png">
<link rel="manifest" href="manifest.json">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root{--bg:#E8E5DF;--surface:#968F83;--surface-soft:#A5A58D;--sent:#A49A87;--received:#A5A58D;--text:#241f1a;--muted:#625c54;--border:rgba(36,31,26,.18);--accent:#C4C4C4;--accent-dark:#968F83}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:sans-serif;height:100dvh;overflow:hidden;display:flex;flex-direction:column}.header-identidade{padding:20px;display:flex;gap:15px;overflow-x:auto;border-bottom:1px solid var(--border);flex-shrink:0;background:var(--bg);border-top:8px solid var(--accent)}.user-avatar{width:60px;height:60px;border-radius:50%;border:2px solid var(--accent-dark);background:var(--surface-soft);color:var(--text);display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative}.user-avatar svg{width:28px;height:28px;stroke-width:1.8}.user-avatar.online:after{content:'';position:absolute;bottom:2px;right:2px;width:12px;height:12px;background:#3c8a42;border-radius:50%;border:2px solid var(--bg)}#area-principal{flex:1;min-height:0;overflow-y:auto;padding:15px 15px 180px;display:flex;flex-direction:column;gap:10px}.balao{padding:12px 14px;border-radius:18px;max-width:80%;font-size:15px;line-height:1.4;overflow-wrap:anywhere;color:var(--text);border:1px solid rgba(36,31,26,.12);box-shadow:0 2px 8px rgba(36,31,26,.08);background:var(--received);align-self:flex-start}.balao.minha{align-self:flex-end;background:var(--sent);border-color:rgba(36,31,26,.15)}.balao strong{color:#211d18}.status{align-self:center;color:var(--muted);font-size:12px;text-align:center;padding:8px}.gaveta-vidro{position:fixed;z-index:10;bottom:0;left:0;width:100%;background:rgba(232,229,223,.94);backdrop-filter:blur(20px);border-top:1px solid var(--border);border-radius:25px 25px 0 0;padding:15px;box-shadow:0 -8px 30px rgba(36,31,26,.12)}.input-row{display:flex;gap:10px;align-items:center;margin-bottom:15px}.audio-preview{max-width:180px;height:36px}input{min-width:0;flex:1;background:#fffdf9;border:1px solid var(--border);padding:12px 20px;border-radius:30px;color:var(--text);outline:none}input::placeholder{color:#81796f}.send{background:var(--surface);color:#fff;border:0;width:45px;height:45px;border-radius:50%;font-weight:bold;display:flex;align-items:center;justify-content:center}.send svg{width:20px;height:20px;stroke-width:2.5}.menu-modulos{display:flex;justify-content:space-around;padding-top:10px;border-top:1px solid var(--border)}.btn-modulo{background:none;border:0;color:var(--muted);font-size:11px;cursor:pointer;padding:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:55px}.btn-modulo svg{width:20px;height:20px;stroke-width:1.8}.btn-modulo:hover,.btn-modulo:active{color:var(--text)}#file-input{display:none}.arcade-menu{position:fixed;z-index:30;left:20px;right:20px;bottom:105px;background:rgba(232,229,223,.98);border:1px solid var(--border);border-radius:22px;padding:18px;box-shadow:0 10px 40px rgba(36,31,26,.25);display:none}.arcade-menu.open{display:block}.arcade-menu h3{margin:0 0 14px;font-size:16px;color:var(--text)}.arcade-link{width:100%;display:flex;align-items:center;gap:12px;padding:14px;margin:8px 0;border:1px solid var(--border);border-radius:14px;background:var(--surface-soft);color:var(--text);text-decoration:none;font-size:14px}.arcade-link svg{width:20px}.arcade-close{width:100%;margin-top:8px;padding:10px;border:0;border-radius:12px;background:var(--surface);color:#fff}.audio-btn.recording{color:#8b2f2f;font-weight:bold}
</style>
</head>
<body>
<div class="header-identidade"><div class="user-avatar online"><i data-lucide="star"></i></div><div class="user-avatar" id="gabriela">G</div></div>
<div id="area-principal"><div class="status" id="status">Conectando ao Turso...</div></div>
<div class="gaveta-vidro">
 <div class="input-row"><button class="btn-modulo" id="foto-btn" type="button" aria-label="Enviar foto"><i data-lucide="camera"></i></button><button class="btn-modulo audio-btn" id="audio-btn" type="button" aria-label="Gravar áudio"><i data-lucide="mic"></i></button><input id="msg-input" autocomplete="off" placeholder="Sua vibe..."><button class="send" id="send-btn" type="button" aria-label="Enviar mensagem"><i data-lucide="send"></i></button></div>
 <div class="status" id="audio-status" style="display:none"></div>
 <div class="menu-modulos"><button class="btn-modulo" id="chat-btn" aria-label="Chat"><i data-lucide="message-circle"></i><span>CHAT</span></button><button class="btn-modulo" id="videos-btn" aria-label="Vídeos"><i data-lucide="clapperboard"></i><span>VÍDEOS</span></button><button class="btn-modulo" id="games-btn" aria-label="Arcade"><i data-lucide="gamepad-2"></i><span>ARCADE</span></button><button class="btn-modulo" id="call-btn" aria-label="Ligar"><i data-lucide="phone"></i><span>LIGAR</span></button></div>
</div>
<div class="arcade-menu" id="arcade-menu">
 <h3>ARCADE</h3>
 <a class="arcade-link" href="https://detiillimichel-max.github.io/hubs-de-jogos/" target="_blank" rel="noopener"><i data-lucide="gamepad-2"></i><span>Hubs de Jogos</span></a>
 <a class="arcade-link" href="https://detiillimichel-max.github.io/-Neural-iA/?v1" target="_blank" rel="noopener"><i data-lucide="brain"></i><span>Neural iA</span></a>
 <button class="arcade-close" id="arcade-close" type="button">Fechar</button>
</div>
<input type="file" id="file-input" accept="image/*">
<audio id="som-notifica" preload="auto" src="https://www.soundjay.com/buttons/sounds/button-50.mp3"></audio>
<script>
(()=>{
'use strict';
const area=document.getElementById('area-principal'),status=document.getElementById('status'),input=document.getElementById('msg-input'),audio=document.getElementById('som-notifica'),fileInput=document.getElementById('file-input'),arcadeMenu=document.getElementById('arcade-menu');
const API='/api/chat'; let meuNome=localStorage.getItem('oio_nome'); let ultimoId=0; let carregando=false;
if(!meuNome){meuNome=prompt('Nome OIO ONE:')||'Michel';localStorage.setItem('oio_nome',meuNome)}
function mostrarStatus(t){status.textContent=t;status.style.display=t?'block':'none'}
function mensagem(m,notificar=false){if(document.querySelector(`[data-id="${m.id}"]`))return;const d=document.createElement('div');d.className='balao'+(m.autor===meuNome?' minha':'');d.dataset.id=m.id;const a=document.createElement('strong');a.textContent=m.autor||'Usuário';d.append(a,document.createElement('br'),document.createTextNode(m.texto||''));area.appendChild(d);area.scrollTop=area.scrollHeight;if(notificar&&m.autor!==meuNome){audio.currentTime=0;audio.play().catch(()=>{})}}
async function carregar(inicial=false){if(carregando)return;carregando=true;try{const url=inicial?`${API}?limit=30`:`${API}?since=${ultimoId}&limit=30`;const r=await fetch(url,{cache:'no-store'});const data=await r.json();if(!r.ok)throw new Error(data.error||'Erro HTTP '+r.status);for(const m of data.messages||[]){mensagem(m,!inicial);ultimoId=Math.max(ultimoId,Number(m.id)||0)}mostrarStatus('')}catch(e){console.error(e);mostrarStatus('Turso não está conectado. Configure os secrets na Vercel.')}finally{carregando=false}}
async function enviar(){const texto=input.value.trim();if(!texto)return;input.disabled=true;try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({autor:meuNome,texto})});const data=await r.json();if(!r.ok)throw new Error(data.error||'Falha ao enviar');mensagem(data.message);ultimoId=Math.max(ultimoId,Number(data.message.id)||0);input.value='';input.focus()}catch(e){console.error(e);mostrarStatus('Não foi possível enviar. Verifique o Turso/Vercel.')}finally{input.disabled=false}}
document.getElementById('send-btn').onclick=enviar;input.onkeydown=e=>{if(e.key==='Enter')enviar()};document.getElementById('chat-btn').onclick=()=>{arcadeMenu.classList.remove('open');area.scrollTop=area.scrollHeight;input.focus()};document.getElementById('videos-btn').onclick=()=>location.href='vibe.html';document.getElementById('games-btn').onclick=()=>arcadeMenu.classList.toggle('open');document.getElementById('arcade-close').onclick=()=>arcadeMenu.classList.remove('open');document.getElementById('call-btn').onclick=()=>location.href='tel:+5511999999999';document.getElementById('gabriela').onclick=()=>alert('Abrindo Gabriela...');document.getElementById('foto-btn').onclick=()=>fileInput.click();fileInput.onchange=()=>{if(fileInput.files.length){mostrarStatus('Upload de imagem será ligado ao Cloudinary nesta próxima etapa.');fileInput.value=''}};document.addEventListener('pointerdown',()=>{audio.play().then(()=>{audio.pause();audio.currentTime=0}).catch(()=>{})},{once:true});
if(window.lucide)lucide.createIcons();
carregar(true);setInterval(()=>carregar(false),2000);
})();
</script>
<script src="assets/js/audio-recorder.js"></script>
</body>
</html>
