name: OIO ID Visual Adjust

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/oio-id-visual-adjust.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  adjust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply visual adjustment
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('oio-id.html')
          s = p.read_text(encoding='utf-8')
          old_bg = ".app { min-height:100vh; background:repeating-linear-gradient(to bottom,transparent 0,transparent 48px,var(--oio-line) 49px,transparent 50px),var(--oio-black); }"
          new_bg = ".app { min-height:100vh; background:var(--oio-black); }"
          if old_bg not in s:
              raise SystemExit('Regra de fundo esperada não encontrada; nenhuma alteração aplicada.')
          s = s.replace(old_bg, new_bg, 1)
          marker = "    .intro p { margin:0; color:var(--oio-muted); font-size:16px; line-height:1.5; }"
          addition = marker + "\n    #loginScreen .intro h1 { text-align:center; }"
          if marker not in s:
              raise SystemExit('Ponto de inserção esperado não encontrado; nenhuma alteração aplicada.')
          s = s.replace(marker, addition, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit adjustment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add oio-id.html
          git diff --cached --quiet && { echo "Nenhuma alteração necessária."; exit 0; }
          git commit -m "style: centralizar Entrar e remover linhas do OIO ID"
          git push

      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/oio-id-visual-adjust.yml
          git commit -m "chore: remover workflow temporário de ajuste visual"
          git push
