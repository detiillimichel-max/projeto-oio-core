<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OIO ARCADE</title>
    <style>
        body { margin: 0; background: #000; color: #00f2fe; font-family: sans-serif; text-align: center; }
        .grid-games { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 20px; }
        .card-game { 
            background: #111; border: 1px solid #333; border-radius: 15px; padding: 20px;
            transition: 0.3s; cursor: pointer; display: flex; flex-direction: column; align-items: center;
        }
        .card-game:active { transform: scale(0.95); border-color: #00f2fe; }
        .icon { font-size: 40px; margin-bottom: 10px; }
        .btn-voltar { margin-top: 20px; background: none; border: 1px solid #333; color: #fff; padding: 10px 20px; border-radius: 20px; }
    </style>
</head>
<body>

    <h2 style="margin-top: 30px;">OIO ARCADE</h2>
    <p style="font-size: 12px; opacity: 0.6;">Módulo de Entretenimento | Michel Detilli</p>

    <div class="grid-games">
        <div class="card-game" onclick="abrir('https://play2048.co/')">
            <div class="icon">🧠</div>
            <span>2048</span>
        </div>
        <div class="card-game" onclick="abrir('https://m.pacman.com/')">
            <div class="icon">👻</div>
            <span>PAC-MAN</span>
        </div>
        <div class="card-game" onclick="abrir('https://tetris.com/play-tetris')">
            <div class="icon">🧊</div>
            <span>TETRIS</span>
        </div>
        <div class="card-game" onclick="abrir('https://www.chess.com/play/online')">
            <div class="icon">👑</div>
            <span>XADREZ</span>
        </div>
    </div>

    <button class="btn-voltar" onclick="window.location.href='teste.html'">❮ VOLTAR AO CHAT</button>

    <script>
        function abrir(url) {
            // Abre o jogo em uma nova camada para não travar o app
            window.location.href = url;
        }
    </script>
</body>
</html>
