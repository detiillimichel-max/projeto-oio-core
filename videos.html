<!DOCTYPE html>
<html lang="pt-br">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>OIO ONE Videos</title>

<style>

body{
margin:0;
background:black;
}

#videoFeed{
height:100vh;
overflow-y:scroll;
scroll-snap-type:y mandatory;
}

.video{
height:100vh;
scroll-snap-align:start;
}

iframe{
width:100%;
height:100%;
border:0;
}

</style>

</head>

<body>

<div id="videoFeed"></div>

<script>

const videos = [

"dQw4w9WgXcQ",
"ysz5S6PUM-U",
"aqz-KE-bpKQ"

];

const feed = document.getElementById("videoFeed");

videos.forEach(id=>{

const div = document.createElement("div");

div.className="video";

div.innerHTML =
`<iframe src="https://www.youtube.com/embed/${id}" allowfullscreen></iframe>`;

feed.appendChild(div);

});

</script>

</body>
</html>
