<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OIO HUB - Entretenimento</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: sans-serif; overflow: hidden; }
        
        /* NATIVO: Deslize Magnético (TikTok Style) */
        .feed-tiktok {
            height: 100vh;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }
        .video-card {
            height: 100vh;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: #000;
            border-bottom: 1px solid #111;
        }

        /* ARCADE: Botões flutuantes para Jogos */
        .arcade-menu {
            position: fixed; top: 20px; right: 20px; z-index: 100;
            display: flex; flex-direction: column; gap: 10px;
        }
        .btn-game {
            background: rgba(0, 242, 254, 0.2); border: 1px solid #00f2fe;
            color: #00f2fe; padding: 10px; border-radius: 50%; font-size: 20px;
            backdrop-filter: blur(5px);
        }

        .btn-voltar {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: #00f2fe; color: #000; border: none; padding: 10px 30px;
            border-radius: 25px; font-weight: bold; z-index: 100;
        }
    </style>
</head>
<body>

    <div class="arcade-menu">
        <button class="btn-game" onclick="window.location.href='https://m.pacman.com/'">👻</button>
        <button class="btn-game" onclick="window.location.href='https://tetris.com/play-tetris'">🧊</button>
    </div>

    <div class="feed-tiktok" id="feed">
        <div class="video-card">
            <h2 style="text-align:center; opacity:0.5;">Deslize para ver memórias...</h2>
        </div>
    </div>

    <button class="btn-voltar" onclick="window.location.href='vibe_connect.html'">💬 CHAT</button>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBG3oBoBvOwySN04gR0CgCCXToZ0G-av60",
            authDomain: "vibe-app-bbba2.firebaseapp.com",
            databaseURL: "https://vibe-app-bbba2-default-rtdb.firebaseio.com/",
            projectId: "vibe-app-bbba2",
            storageBucket: "vibe-app-bbba2.appspot.com",
            messagingSenderId: "329513213082",
            appId: "1:329513213082:web:3938e86538f8a04a05323"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Carregar vídeos do Feed
        db.ref('feed_tiktok').limitToLast(10).on('value', snap => {
            const feed = document.getElementById('feed');
            feed.innerHTML = ""; 
            snap.forEach(item => {
                const v = item.val();
                feed.innerHTML += `
                    <div class="video-card">
                        <video src="${v.url}" loop onclick="this.paused?this.play():this.pause()" style="width:100%; max-height:80vh;"></video>
                        <p style="padding:20px;">@${v.autor}</p>
                    </div>`;
            });
        });
    </script>
</body>
</html>
