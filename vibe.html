<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OIO VÍDEOS - TIKTOK</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-storage-compat.js"></script>
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: sans-serif; overflow: hidden; }
        /* EFEITO TIKTOK: Rola um por um */
        .feed-tiktok { height: 100vh; scroll-snap-type: y mandatory; overflow-y: scroll; }
        .video-card { height: 100vh; scroll-snap-align: start; display: flex; flex-direction: column; justify-content: center; position: relative; border-bottom: 1px solid #222; }
        video { width: 100%; height: 80vh; object-fit: contain; }
        .info-video { padding: 20px; position: absolute; bottom: 100px; background: linear-gradient(transparent, rgba(0,0,0,0.8)); width: 100%; }
        .btn-postar { position: fixed; bottom: 80px; right: 20px; background: #00f2fe; color: #000; border: none; padding: 15px 25px; border-radius: 30px; font-weight: bold; z-index: 10; }
        .btn-voltar { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(255,255,255,0.1); border: 1px solid #333; color: #fff; padding: 10px 25px; border-radius: 20px; z-index: 10; }
    </style>
</head>
<body>

    <div class="feed-tiktok" id="feed">
        </div>

    <button class="btn-postar" onclick="postarVideo()">＋ POSTAR VÍDEO</button>
    <button class="btn-voltar" onclick="window.location.href='teste.html'">❮ VOLTAR AO CHAT</button>

    <script>
        // Use o seu FirebaseConfig aqui (igual ao do teste.html)
        const firebaseConfig = {
            apiKey: "AIzaSyBG3oBoBvOwySN04gR0CgCCXToZ0G-av60",
            authDomain: "vibe-app-bbba2.firebaseapp.com",
            databaseURL: "https://vibe-app-bbba2-default-rtdb.firebaseio.com/",
            projectId: "vibe-app-bbba2",
            storageBucket: "vibe-app-bbba2.appspot.com",
            messagingSenderId: "329513213082",
            appId: "1:329513213082:web:3938e86538f8a04a05323"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const storage = firebase.storage();

        // MEMÓRIA: Volta para onde o usuário parou
        const feed = document.getElementById('feed');
        feed.onscroll = () => localStorage.setItem('vibe_posicao', feed.scrollTop);
        window.onload = () => feed.scrollTop = localStorage.getItem('vibe_posicao') || 0;

        // BUSCAR VÍDEOS NO FIREBASE
        db.ref('feed_tiktok').on('value', snap => {
            feed.innerHTML = "";
            snap.forEach(item => {
                const v = item.val();
                feed.innerHTML += `
                    <div class="video-card">
                        <video src="${v.url}" loop onclick="this.paused?this.play():this.pause()"></video>
                        <div class="info-video"><strong>@${v.autor}</strong></div>
                    </div>`;
            });
        });

        // FUNÇÃO POSTAR
        async function postarVideo() {
            const fileInput = document.createElement('input');
            fileInput.type = 'file'; fileInput.accept = 'video/*';
            fileInput.onchange = async e => {
                const file = e.target.files[0];
                alert("Enviando... Aguarde o sinal da Estrela ⭐");
                const ref = storage.ref().child('videos/' + Date.now());
                await ref.put(file);
                const url = await ref.getDownloadURL();
                await db.ref('feed_tiktok').push({ autor: localStorage.getItem("oio_nome") || "Michel", url: url, data: Date.now() });
                alert("Postado!");
            };
            fileInput.click();
        }
    </script>
</body>
</html>
