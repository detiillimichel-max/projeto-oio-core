<!DOCTYPE html>
<html lang="pt-br">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>OIO VÍDEOS - TIKTOK</title><script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script><style>:root{--oio-bg:#000;--oio-surface:#121319;--oio-accent:#C4C4C4;--oio-text:#241f1a}*{box-sizing:border-box}body{margin:0;background:var(--oio-bg);color:#fff;font-family:sans-serif;overflow:hidden}.feed-tiktok{height:100vh;scroll-snap-type:y mandatory;overflow-y:scroll}.video-card{height:100vh;scroll-snap-align:start;display:flex;flex-direction:column;justify-content:center;position:relative;border-bottom:1px solid #222}video{width:100%;height:80vh;object-fit:contain}.info-video{padding:20px;position:absolute;bottom:100px;background:linear-gradient(transparent,rgba(0,0,0,.8));width:100%}.btn-postar{position:fixed;top:20px;right:20px;bottom:auto;background:#C4C4C4;color:#241f1a;border:0;padding:15px 25px;border-radius:30px;font-weight:bold;z-index:10;cursor:pointer}.btn-apagar{position:absolute;top:90px;right:20px;background:rgba(25,25,25,.88);color:#fff;border:1px solid #555;padding:10px 15px;border-radius:22px;font-size:12px;font-weight:700;z-index:8;cursor:pointer}.btn-voltar{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.1);border:1px solid #333;color:#fff;padding:10px 25px;border-radius:20px;z-index:10;cursor:pointer}.post-overlay{position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.72);backdrop-filter:blur(5px)}.post-overlay.open{display:flex}.post-panel{width:min(100%,520px);max-height:92vh;overflow-y:auto;background:#121319;border:1px solid #303139;border-radius:26px 26px 0 0;padding:20px;box-shadow:0 -15px 50px rgba(0,0,0,.45)}.post-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.post-head h2{margin:0;font-size:18px}.post-close{width:38px;height:38px;border:0;border-radius:50%;background:#24252b;color:#fff;font-size:22px;cursor:pointer}.video-picker{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}.video-picker button,.post-publish{border:0;border-radius:16px;padding:14px;font-weight:700;cursor:pointer}.video-picker button{background:#24252b;color:#fff;border:1px solid #383941}.video-picker button:first-child{background:#C4C4C4;color:#241f1a}.preview-wrap{display:none;background:#000;border-radius:18px;overflow:hidden;margin-bottom:14px}.preview-wrap.show{display:block}#video-preview{display:block;width:100%;max-height:48vh;object-fit:contain;background:#000}.video-meta{display:none;justify-content:space-between;gap:10px;margin:8px 0 14px;font-size:12px;color:#aaa}.video-meta.show{display:flex}.description-label{display:flex;justify-content:space-between;margin-bottom:7px;font-size:13px;color:#ddd}#video-description{width:100%;min-height:48px;resize:none;background:#202126;border:1px solid #3a3b43;border-radius:14px;color:#fff;padding:13px;outline:none;font:inherit}#video-description:focus{border-color:#C4C4C4}#video-description.invalid{border-color:#d96b6b}.post-error{min-height:20px;margin:8px 0;color:#ff9b9b;font-size:12px}.post-error.success{color:#b9d9b9}.post-publish{width:100%;background:#C4C4C4;color:#241f1a}.post-publish:disabled{opacity:.45;cursor:not-allowed}.post-note{margin:10px 2px 0;color:#888;font-size:11px;line-height:1.4;text-align:center}#video-camera-input,#video-gallery-input{display:none}.admin-overlay{position:fixed;inset:0;z-index:120;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(0,0,0,.58);backdrop-filter:blur(8px)}.admin-overlay.open{display:flex}.admin-card{width:min(100%,520px);background:rgba(232,229,223,.98);color:#241f1a;border:1px solid rgba(36,31,26,.18);border-radius:28px;padding:26px;box-shadow:0 20px 60px rgba(0,0,0,.4)}.admin-card h2{margin:0 0 20px;font-size:28px;letter-spacing:.2px}.admin-card p{margin:0 0 16px;font-size:15px;line-height:1.45;color:#4f4942}.admin-field{position:relative;margin-bottom:14px}.admin-field input{width:100%;height:52px;padding:0 50px 0 16px;border:1px solid rgba(36,31,26,.22);border-radius:16px;background:#fffdf9;color:#241f1a;font:inherit;outline:none}.admin-field input:focus{border-color:#968f83;box-shadow:0 0 0 2px rgba(150,143,131,.18)}.admin-eye{position:absolute;right:6px;top:6px;width:40px;height:40px;border:0;border-radius:12px;background:transparent;color:#625c54;cursor:pointer}.admin-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.admin-actions button{min-height:50px;border:0;border-radius:16px;font:inherit;font-weight:700;cursor:pointer}.admin-confirm{background:#A5A58D;color:#241f1a}.admin-cancel{background:#968F83;color:#fff}.admin-error{min-height:20px;margin:8px 0 14px;color:#9b3434;font-size:13px}.admin-warning{background:rgba(165,165,141,.28);border-radius:16px;padding:13px;margin-bottom:16px;font-size:14px;line-height:1.4}</style></head>
<body><div class="feed-tiktok" id="feed"></div><button class="btn-postar" onclick="abrirPostagem()">＋ POSTAR VÍDEO</button><button class="btn-voltar" onclick="window.location.href='teste.html'">❮ VOLTAR AO CHAT</button><div class="post-overlay" id="post-overlay" aria-hidden="true"><section class="post-panel" role="dialog" aria-modal="true" aria-labelledby="post-title"><div class="post-head"><h2 id="post-title">Postar vídeo</h2><button class="post-close" type="button" onclick="fecharPostagem()" aria-label="Fechar">×</button></div><div class="video-picker"><button type="button" onclick="document.getElementById('video-camera-input').click()">Câmera</button><button type="button" onclick="document.getElementById('video-gallery-input').click()">Escolher vídeo</button></div><input id="video-camera-input" type="file" accept="video/*" capture="environment"><input id="video-gallery-input" type="file" accept="video/mp4,video/webm,video/quicktime,video/*"><div class="preview-wrap" id="preview-wrap"><video id="video-preview" controls playsinline></video></div><div class="video-meta" id="video-meta"><span id="video-duration">Duração: —</span><span id="video-size">Tamanho: —</span></div><label class="description-label" for="video-description"><span>Descrição</span><span id="description-counter">0/100</span></label><textarea id="video-description" maxlength="100" placeholder="Escreva uma descrição curta..." disabled></textarea><div class="post-error" id="post-error" role="alert"></div><button class="post-publish" id="post-publish" type="button" disabled onclick="publicarNoCloudinary()">PUBLICAR VÍDEO</button><p class="post-note">Vídeos válidos são enviados ao Cloudinary em oio-core/videos e registrados no Turso.</p></section></div><div class="admin-overlay" id="admin-overlay" aria-hidden="true"><section class="admin-card" role="dialog" aria-modal="true" aria-labelledby="admin-title"><h2 id="admin-title">ADMINISTRAÇÃO</h2><p id="admin-message">Digite a senha de administrador para continuar.</p><div class="admin-warning" id="admin-warning" style="display:none">Esta ação removerá o vídeo do feed e também do Cloudinary.</div><div class="admin-field" id="admin-field"><input id="admin-password" type="password" autocomplete="current-password" placeholder="Senha de administrador" aria-label="Senha de administrador"><button class="admin-eye" id="admin-eye" type="button" aria-label="Mostrar senha">◉</button></div><div class="admin-error" id="admin-error" role="alert"></div><div class="admin-actions"><button class="admin-cancel" id="admin-cancel" type="button">Cancelar</button><button class="admin-confirm" id="admin-confirm" type="button">CONTINUAR</button></div></section></div>
<script>
const firebaseConfig={apiKey:"AIzaSyBG3oBoBvOwySN04gR0CgCCXToZ0G-av60",authDomain:"vibe-app-bbba2.firebaseapp.com",databaseURL:"https://vibe-app-bbba2-default-rtdb.firebaseio.com/",projectId:"vibe-app-bbba2",storageBucket:"vibe-app-bbba2.appspot.com",messagingSenderId:"329513213082",appId:"1:329513213082:web:3938e86538f8a04a05323"};firebase.initializeApp(firebaseConfig);const db=firebase.database();const CLOUDINARY_CLOUD_NAME='hmnhqfco',CLOUDINARY_VIDEO_PRESET='oio_core_videos_upload',CLOUDINARY_VIDEO_UPLOAD_URL=`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/video/upload`,VIDEOS_API_URL='/api/videos';const feed=document.getElementById('feed'),overlay=document.getElementById('post-overlay'),previewWrap=document.getElementById('preview-wrap'),preview=document.getElementById('video-preview'),description=document.getElementById('video-description'),counter=document.getElementById('description-counter'),errorBox=document.getElementById('post-error'),publishBtn=document.getElementById('post-publish'),meta=document.getElementById('video-meta'),durationLabel=document.getElementById('video-duration'),sizeLabel=document.getElementById('video-size');const adminOverlay=document.getElementById('admin-overlay'),adminTitle=document.getElementById('admin-title'),adminMessage=document.getElementById('admin-message'),adminWarning=document.getElementById('admin-warning'),adminField=document.getElementById('admin-field'),adminPassword=document.getElementById('admin-password'),adminEye=document.getElementById('admin-eye'),adminError=document.getElementById('admin-error'),adminCancel=document.getElementById('admin-cancel'),adminConfirm=document.getElementById('admin-confirm');const MAX_VIDEOS=10,MAX_DURATION_SECONDS=30,MAX_SIZE_BYTES=30*1024*1024;let videoSelecionado=null,videoObjectUrl=null,publicando=false,adminResolver=null,adminMode='publish';feed.onscroll=()=>localStorage.setItem('vibe_posicao',feed.scrollTop);window.addEventListener('load',()=>{feed.scrollTop=Number(localStorage.getItem('vibe_posicao')||0);carregarFeed()});function pausarOutros(videoAtual){feed.querySelectorAll('video').forEach(v=>{if(v!==videoAtual)v.pause()})}const videoObserver=new IntersectionObserver(entries=>{entries.forEach(entry=>{if(!entry.isIntersecting||entry.intersectionRatio<.6)entry.target.pause()})},{root:feed,threshold:[0,.6,1]});function criarCard(v){const card=document.createElement('div');card.className='video-card';const video=document.createElement('video');video.src=v.url||'';video.loop=true;video.playsInline=true;video.muted=false;video.volume=1;video.onclick=()=>{if(video.paused){pausarOutros(video);video.play().catch(()=>{})}else video.pause()};videoObserver.observe(video);const info=document.createElement('div');info.className='info-video';const author=document.createElement('strong');author.textContent='@'+(v.autor||'Usuário');info.appendChild(author);if(v.descricao){info.appendChild(document.createElement('br'));info.appendChild(document.createTextNode(v.descricao))}card.append(video,info);if(v.id){const apagar=document.createElement('button');apagar.type='button';apagar.className='btn-apagar';apagar.textContent='APAGAR';apagar.onclick=e=>{e.stopPropagation();excluirVideo(v.id,card,video)};card.appendChild(apagar)}return card}async function carregarFeed(){let videosTurso=[];try{const resposta=await fetch(VIDEOS_API_URL,{cache:'no-store'});if(!resposta.ok)throw new Error('API HTTP '+resposta.status);const dados=await resposta.json();videosTurso=Array.isArray(dados.videos)?dados.videos:[]}catch(erro){console.warn('Feed Turso indisponível:',erro)}feed.innerHTML='';videosTurso.forEach(v=>feed.appendChild(criarCard(v)));try{await new Promise(resolve=>{db.ref('feed_tiktok').once('value',snap=>{snap.forEach(item=>feed.appendChild(criarCard(item.val())));resolve()},()=>resolve())})}catch(erro){console.warn('Feed legado indisponível:',erro)}}function abrirPostagem(){errorBox.textContent='';errorBox.classList.remove('success');const quantidade=feed.querySelectorAll('.video-card').length;if(quantidade>=MAX_VIDEOS){alert('O limite de 10 vídeos já foi atingido. O limite definitivo também é validado pelo servidor.');return}overlay.classList.add('open');overlay.setAttribute('aria-hidden','false')}function fecharPostagem(){if(publicando)return;overlay.classList.remove('open');overlay.setAttribute('aria-hidden','true');limparSelecao()}function limparSelecao(){videoSelecionado=null;if(videoObjectUrl)URL.revokeObjectURL(videoObjectUrl);videoObjectUrl=null;preview.pause();preview.removeAttribute('src');preview.load();previewWrap.classList.remove('show');meta.classList.remove('show');description.value='';description.disabled=true;counter.textContent='0/100';publishBtn.disabled=true;publishBtn.textContent='PUBLICAR VÍDEO';errorBox.textContent='';errorBox.classList.remove('success')}function selecionarVideo(file){if(!file)return;limparSelecao();errorBox.textContent='';if(!file.type.startsWith('video/')){errorBox.textContent='Escolha um arquivo de vídeo válido.';return}if(file.size>MAX_SIZE_BYTES){errorBox.textContent='Este vídeo ultrapassa o limite de 30 MB.';return}videoSelecionado=file;videoObjectUrl=URL.createObjectURL(file);preview.src=videoObjectUrl;previewWrap.classList.add('show');meta.classList.add('show');sizeLabel.textContent='Tamanho: '+formatarTamanho(file.size);preview.onloadedmetadata=()=>{const duracao=Number(preview.duration||0);durationLabel.textContent='Duração: '+formatarDuracao(duracao);if(!Number.isFinite(duracao)||duracao<=0){errorBox.textContent='Não foi possível identificar a duração do vídeo.';return}if(duracao>MAX_DURATION_SECONDS){errorBox.textContent='O vídeo precisa ter no máximo 30 segundos.';description.disabled=true;publishBtn.disabled=true;return}description.disabled=false;publishBtn.disabled=false}}document.getElementById('video-camera-input').addEventListener('change',e=>selecionarVideo(e.target.files[0]));document.getElementById('video-gallery-input').addEventListener('change',e=>selecionarVideo(e.target.files[0]));description.addEventListener('input',()=>{counter.textContent=description.value.length+'/100';description.classList.toggle('invalid',description.value.length>100)});function abrirAdmin(mode,callback){adminMode=mode;adminResolver=callback;adminTitle.textContent=mode==='delete'?'EXCLUIR VÍDEO':'ADMINISTRAÇÃO';adminMessage.textContent=mode==='delete'?'Digite a senha de administrador para excluir este vídeo.':'Digite a senha de administrador para publicar este vídeo.';adminWarning.style.display=mode==='delete'?'block':'none';adminWarning.textContent=mode==='delete'?'Esta ação removerá o vídeo do feed e também do Cloudinary.':'A senha será usada somente para autorizar a operação no servidor.';adminPassword.value='';adminError.textContent='';adminField.style.display='block';adminConfirm.textContent='CONTINUAR';adminConfirm.onclick=()=>{const senha=adminPassword.value.trim();if(!senha){adminError.textContent='Digite a senha de administrador.';adminPassword.focus();return}if(adminMode==='delete'){adminMessage.textContent='Tem certeza que deseja excluir este vídeo?';adminWarning.style.display='block';adminWarning.textContent='Ele será removido definitivamente do feed e do Cloudinary.';adminField.style.display='none';adminError.textContent='';adminConfirm.textContent='APAGAR VÍDEO';adminConfirm.onclick=()=>{const resolver=adminResolver;adminResolver=null;adminOverlay.classList.remove('open');adminOverlay.setAttribute('aria-hidden','true');adminPassword.value='';if(resolver)resolver({password:senha,confirmed:true})}}else{fecharAdmin(senha)}};adminOverlay.classList.add('open');adminOverlay.setAttribute('aria-hidden','false');setTimeout(()=>adminPassword.focus(),50)}function fecharAdmin(result=null){adminOverlay.classList.remove('open');adminOverlay.setAttribute('aria-hidden','true');adminPassword.value='';adminError.textContent='';const resolver=adminResolver;adminResolver=null;if(resolver)resolver(result)}adminCancel.onclick=()=>fecharAdmin(null);adminEye.onclick=()=>{const mostrar=adminPassword.type==='password';adminPassword.type=mostrar?'text':'password';adminEye.textContent='◉';adminEye.setAttribute('aria-label',mostrar?'Ocultar senha':'Mostrar senha')};adminPassword.onkeydown=e=>{if(e.key==='Enter')adminConfirm.click();if(e.key==='Escape')fecharAdmin(null)};async function publicarNoCloudinary(){const quantidade=feed.querySelectorAll('.video-card').length,texto=description.value.trim(),duracao=Number(preview.duration||0);if(publicando)return;if(quantidade>=MAX_VIDEOS){errorBox.textContent='O limite de 10 vídeos já foi atingido.';return}if(!videoSelecionado){errorBox.textContent='Escolha um vídeo primeiro.';return}if(videoSelecionado.size>MAX_SIZE_BYTES){errorBox.textContent='Este vídeo ultrapassa o limite de 30 MB.';return}if(!Number.isFinite(duracao)||duracao<=0||duracao>MAX_DURATION_SECONDS){errorBox.textContent='O vídeo precisa ter no máximo 30 segundos.';return}if(texto.length>100){errorBox.textContent='A descrição pode ter no máximo 100 caracteres.';return}const adminPasswordValue=await new Promise(resolve=>abrirAdmin('publish',resolve));if(!adminPasswordValue){errorBox.textContent='Publicação cancelada.';return}publicando=true;publishBtn.disabled=true;publishBtn.textContent='ENVIANDO...';errorBox.classList.remove('success');errorBox.textContent='Enviando vídeo ao Cloudinary...';try{const formData=new FormData();formData.append('file',videoSelecionado);formData.append('upload_preset',CLOUDINARY_VIDEO_PRESET);const respostaCloudinary=await fetch(CLOUDINARY_VIDEO_UPLOAD_URL,{method:'POST',body:formData});const dados=await respostaCloudinary.json().catch(()=>({}));if(!respostaCloudinary.ok)throw new Error(dados?.error?.message||'Cloudinary retornou HTTP '+respostaCloudinary.status);if(!dados.secure_url||!dados.public_id)throw new Error('Cloudinary não retornou os dados esperados do vídeo.');errorBox.textContent='Cloudinary OK. Registrando vídeo no Turso...';const respostaApi=await fetch(VIDEOS_API_URL,{method:'POST',headers:{'Content-Type':'application/json','x-oio-video-admin':adminPasswordValue},body:JSON.stringify({url:dados.secure_url,public_id:dados.public_id,descricao:texto,autor:localStorage.getItem('oio_nome')||'Michel',duracao:Number(dados.duration)||duracao,tamanho:Number(dados.bytes)||videoSelecionado.size,formato:dados.format||''})});const apiDados=await respostaApi.json().catch(()=>({}));if(!respostaApi.ok)throw new Error(apiDados?.error||'API de vídeos retornou HTTP '+respostaApi.status);errorBox.classList.add('success');errorBox.textContent='✓ Vídeo publicado no Cloudinary e registrado no Turso.';publishBtn.textContent='VÍDEO PUBLICADO';await carregarFeed();setTimeout(()=>fecharPostagem(),700)}catch(erro){console.error('Erro na publicação:',erro);errorBox.classList.remove('success');errorBox.textContent='Não foi possível publicar: '+(erro.message||'erro desconhecido');publishBtn.disabled=false;publishBtn.textContent='PUBLICAR VÍDEO'}finally{publicando=false}}async function excluirVideo(id,card,video){if(publicando)return;const adminData=await new Promise(resolve=>abrirAdmin('delete',resolve));if(!adminData||!adminData.confirmed)return;const adminPasswordValue=adminData.password;publicando=true;card.style.opacity='.55';try{const resposta=await fetch(VIDEOS_API_URL,{method:'DELETE',headers:{'Content-Type':'application/json','x-oio-video-admin':adminPasswordValue},body:JSON.stringify({id})});const dados=await resposta.json().catch(()=>({}));if(!resposta.ok)throw new Error(dados?.error||'API de vídeos retornou HTTP '+resposta.status);videoObserver.unobserve(video);video.pause();card.remove()}catch(erro){console.error('Erro ao apagar:',erro);card.style.opacity='';alert('Não foi possível apagar: '+(erro.message||'erro desconhecido'))}finally{publicando=false}}adminOverlay.addEventListener('click',e=>{if(e.target===adminOverlay)fecharAdmin(null)});function formatarDuracao(segundos){const total=Math.max(0,Math.floor(Number(segundos)||0)),minutos=Math.floor(total/60),segundosRestantes=total%60;return minutos+':'+String(segundosRestantes).padStart(2,'0')}function formatarTamanho(bytes){const total=Number(bytes)||0;if(total<1024*1024)return Math.max(1,Math.round(total/1024))+' KB';return(total/(1024*1024)).toFixed(1)+' MB'}
</script></body></html>
