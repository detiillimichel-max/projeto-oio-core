<div id="oio-tok-container" style="height: 100vh; background: #000; overflow-y: scroll; snap-type: y mandatory;">
    
    <div style="height: 100vh; snap-align: start; position: relative;">
        <video src="LINK_DO_SEU_VIDEO" loop playsinline style="width: 100%; height: 100%; object-fit: cover;" onclick="this.paused ? this.play() : this.pause()"></video>
        
        <div style="position: absolute; bottom: 100px; left: 20px; color: white; font-family: sans-serif;">
            <h2 style="margin: 0;">@MichelDetilli</h2>
            <p>OIO ONE - Ergonomia Dinâmica</p>
        </div>
    </div>

</div>

<script>
    // Ativador de vibração nativa ao trocar de vídeo (Salto Quântico)
    document.getElementById('oio-tok-container').addEventListener('scroll', () => {
        if (window.navigator.vibrate) window.navigator.vibrate(10);
    });
</script>
